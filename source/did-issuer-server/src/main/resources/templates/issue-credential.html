<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OID4VCI Issuer Test Console</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: #f0f2f5;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: max-width 0.3s ease;
        }

        /* PC Layout: Side by Side */
        @media (min-width: 900px) {
            .container {
                max-width: 1000px;
            }
            .main-content {
                display: flex;
                gap: 40px;
                align-items: flex-start;
                text-align: left;
            }
            .form-section {
                flex: 1;
                min-width: 400px;
            }
            .result-section {
                flex: 1;
                margin-top: 0 !important;
                padding-left: 40px;
                border-left: 1px solid #eee;
                min-height: 400px;
            }
            .result-container {
                margin-top: 0;
            }
        }

        h1 {
            color: #1c1e21;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            color: #606770;
            font-size: 16px;
            margin-bottom: 30px;
        }

        #credentialOfferForm {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #userId,
        #credentialConfigurationId {
            width: 100%;
            padding: 14px;
            border: 1px solid #dddfe2;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff;
        }

        #userId:focus,
        #credentialConfigurationId:focus {
            outline: none;
            border-color: #1877f2;
            box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.2);
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #1877f2;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #166fe5;
        }

        .result-container {
            margin-top: 30px;
            text-align: left;
            display: none;
        }

        .qr-code-wrapper {
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #f8f9fa;
            margin-bottom: 20px;
        }

        #qrCodeImage {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .info-wrapper label {
            display: block;
            color: #606770;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .info-wrapper input[readonly],
        .info-wrapper textarea[readonly] {
            background-color: #f5f6f7;
        }

        .info-wrapper input,
        .info-wrapper textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            background-color: #ffffff;
            font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            box-sizing: border-box;
        }

        .info-wrapper textarea {
            height: 150px;
            resize: vertical;
        }

        .info-group {
            margin-bottom: 15px;
        }

        .flow-selection {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .flow-selection label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }

        .flow-selection input[type="radio"] {
            margin-right: 8px;
        }

        #txCodeDisplay {
            font-size: 2rem;
            font-weight: 700;
            color: #1877f2;
            text-align: center;
            letter-spacing: 3px;
            border: 2px solid #1877f2;
            background-color: #ffffff;
            padding: 12px;
        }

        #txCodeDisplay:focus {
            outline: none;
        }

        #deepLinkButton {
            margin-top: 10px;
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #deepLinkButton:hover {
            background-color: #218838;
        }

        .mobile-text {
            display: inline;
        }

        .pc-text {
            display: none;
        }

        @media (min-width: 900px) {
            .mobile-text {
                display: none;
            }
            .pc-text {
                display: inline;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 20px;
            }

            p {
                font-size: 14px;
            }

            #txCodeDisplay {
                font-size: 1.5rem;
            }

            .qr-code-wrapper {
                display: none !important;
            }

            .info-group label[for="qrDataDisplay"],
            #qrDataDisplay {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Credential Offer</h1>
        <p>Please enter your User ID and select a flow to generate a QR code.</p>

        <div class="main-content">
            <div class="form-section">
                <form id="credentialOfferForm">
                    <div class="flow-selection">
                        <label for="preAuthFlow">
                            <input type="radio" id="preAuthFlow" name="grantType" value="pre-authorized_code" checked>
                            Pre-Authorized Code Flow
                        </label>
                        <label for="authCodeFlow">
                            <input type="radio" id="authCodeFlow" name="grantType" value="authorization_code">
                            Authorization Code Flow
                        </label>
                    </div>

                    <div class="flow-selection">
                        <label for="offerByReference">
                            <input type="radio" id="offerByReference" name="offerType" value="reference" checked>
                            By Reference
                        </label>
                        <label for="offerByValue">
                            <input type="radio" id="offerByValue" name="offerType" value="value">
                            By Value
                        </label>
                    </div>

                    <div style="text-align: left; margin-bottom: 20px;">
                        <label for="customScheme" style="display: block; font-size: 14px; color: #606770; margin-bottom: 5px;">Custom Scheme</label>
                        <input type="text" id="customScheme" name="customScheme" value="openid-credential-offer:" 
                               placeholder="e.g., openid-credential-offer:" 
                               style="width: 100%; padding: 10px; border: 1px solid #dddfe2; border-radius: 6px; box-sizing: border-box;">
                    </div>

                    <input type="text" id="userId" name="userId" placeholder="User ID" required>

                    <select id="credentialConfigurationId" name="credentialConfigurationId" required>
                        <option value="">Loading credential configurations...</option>
                    </select>

                    <button type="submit" style="width: 100%; margin-top: 10px;">
                        <span class="mobile-text">Create Credential Offer</span>
                        <span class="pc-text">Generate QR Code</span>
                    </button>
                </form>

                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button type="button" onclick="window.location.href='/metadata-page'"
                        style="background-color: #6c757d; flex: 1;">Manage Metadata</button>
                    <button type="button" onclick="window.location.href='/claims-page'"
                        style="background-color: #6c757d; flex: 1;">Manage User Claims</button>
                </div>
            </div>

            <div class="result-section">
                <div id="resultContainer" class="result-container">
                    <div class="qr-code-wrapper">
                        <img id="qrCodeImage" src="" alt="Credential Offer QR Code">
                    </div>
                    <div class="info-wrapper">
                        <div id="txCodeGroup" class="info-group">
                            <label for="txCodeDisplay">Tx Code</label>
                            <input type="text" id="txCodeDisplay" readonly>
                        </div>
                        <div class="info-group">
                            <label for="qrDataDisplay">Full Offer URI (qrData)</label>
                            <textarea id="qrDataDisplay" placeholder="Enter URI to generate QR code"></textarea>
                            <button type="button" id="deepLinkButton" style="display: none;">Access Deep Link</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const qrDataDisplay = document.getElementById('qrDataDisplay');
        const qrImage = document.getElementById('qrCodeImage');
        const deepLinkButton = document.getElementById('deepLinkButton');
        const credentialConfigurationSelect = document.getElementById('credentialConfigurationId');

        function loadCredentialConfigurations() {
            credentialConfigurationSelect.disabled = true;

            fetch('/.well-known/openid-credential-issuer')
                .then(response => {
                    if (!response.ok) return response.json().then(err => Promise.reject(err));
                    return response.json();
                })
                .then(metadata => {
                    const configurations = metadata.credential_configurations_supported || {};
                    const configurationIds = Object.keys(configurations);

                    credentialConfigurationSelect.innerHTML = '';

                    if (configurationIds.length === 0) {
                        const option = document.createElement('option');
                        option.value = '';
                        option.textContent = 'No credential configurations available';
                        credentialConfigurationSelect.appendChild(option);
                        return;
                    }

                    configurationIds.forEach(configurationId => {
                        const option = document.createElement('option');
                        option.value = configurationId;
                        option.textContent = configurationId;
                        credentialConfigurationSelect.appendChild(option);
                    });

                    credentialConfigurationSelect.disabled = false;
                })
                .catch(error => {
                    console.error('Error loading credential configurations:', error);
                    credentialConfigurationSelect.innerHTML = '';
                    const option = document.createElement('option');
                    option.value = '';
                    option.textContent = 'Failed to load credential configurations';
                    credentialConfigurationSelect.appendChild(option);
                });
        }

        function updateQrFromUri(uri) {
            if (!uri || !uri.trim()) return;

            fetch('/qr-data/generate-qr-from-uri', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ uri: uri.trim() })
            })
            .then(response => {
                if (!response.ok) return response.json().then(err => Promise.reject(err));
                return response.json();
            })
            .then(data => {
                if (data.qrImage) {
                    qrImage.src = "data:image/png;base64," + data.qrImage;
                }
            })
            .catch(error => {
                console.error('Error updating QR:', error);
            });
        }

        qrDataDisplay.addEventListener('input', function() {
            const uri = this.value;
            if (uri) {
                deepLinkButton.style.display = 'block';
                // debounce QR update
                clearTimeout(this.timeout);
                this.timeout = setTimeout(() => updateQrFromUri(uri), 500);
            } else {
                deepLinkButton.style.display = 'none';
            }
        });

        deepLinkButton.onclick = function () {
            const uri = qrDataDisplay.value;
            if (uri) {
                window.location.href = uri;
            }
        };

        document.getElementById('credentialOfferForm').addEventListener('submit', function (event) {
            event.preventDefault();
            const userId = document.getElementById('userId').value;
            const selectedGrantType = document.querySelector('input[name="grantType"]:checked').value;
            const selectedOfferType = document.querySelector('input[name="offerType"]:checked').value;
            const customScheme = document.getElementById('customScheme').value;
            const credentialConfigurationId = credentialConfigurationSelect.value;

            if (!userId.trim()) {
                alert('User ID cannot be empty.');
                return;
            }

            if (!credentialConfigurationId) {
                alert('Credential Configuration cannot be empty.');
                return;
            }

            const txCodeGroup = document.getElementById('txCodeGroup');
            const resultContainer = document.getElementById('resultContainer');
            const txCodeDisplay = document.getElementById('txCodeDisplay');

            qrImage.src = '';
            txCodeDisplay.value = '';
            qrDataDisplay.value = '';
            resultContainer.style.display = 'none';
            deepLinkButton.style.display = 'none';
            txCodeGroup.style.display = 'none';

            fetch('/qr-data/generate-qr', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },

                body: JSON.stringify({
                    userId: userId,
                    credentialConfigurationId: credentialConfigurationId,
                    grantType: selectedGrantType,
                    offerType: selectedOfferType,
                    scheme: customScheme
                })
            })
                .then((response) => {
                    if (!response.ok) {
                        return response.json().then(errorData => Promise.reject(errorData));
                    }
                    return response.json();
                })
                .then((data) => {
                    resultContainer.style.display = 'block';
                    qrImage.src = "data:image/png;base64," + data.qrImage;
                    qrDataDisplay.value = data.qrData;

                    if (data.txCode) {
                        txCodeGroup.style.display = 'block';
                        txCodeDisplay.value = data.txCode;
                    } else {
                        txCodeGroup.style.display = 'none';
                    }
                    if (data.qrData) {
                        deepLinkButton.style.display = 'block';
                    } else {
                        deepLinkButton.style.display = 'none';
                    }
                })
                .catch((error) => {
                    console.error('Error:', error);
                    const errorMessage = error.message || "알 수 없는 오류가 발생했습니다.";
                    alert("오류: " + errorMessage);
                });

        });

        loadCredentialConfigurations();
    </script>
</body>

</html>
