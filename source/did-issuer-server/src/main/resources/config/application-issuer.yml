issuer:
  server-ip: ${ISSUER_SERVER_IP:127.0.0.1}
  server-port: 8091
  base-url: ${ISSUER_BASE_URL:http://${issuer.server-ip}:${issuer.server-port}}
  sdk:
    config-source: DB
  data-dir: .
  metadata-file-path: metadata/issuer_meta.json
  wallet-file-name: ${wallet.file-path}
  status-list:
    bootstrap:
      ttl-seconds: 1800


oid4vc:
  auth:
    issuer-url: ${issuer.base-url}
    clients:
      issuer-server:
        url: ${issuer.base-url}

clients:
  auth-server:
    url: ${issuer.base-url}



# Access Token을 발급한 인가서버의 JWKS 엔드포인트 주소
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${clients.auth-server.url}/oauth2/jwks

