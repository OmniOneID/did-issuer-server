<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Issuer Admin 화면 설계서</title>
  <style>
/* ═══════════════════════════════════════════════════════════
   Unified Verifier — Interactive Spec Template
   Base: designtemplate/style.css + aos-ca-wallet-mock.html
═══════════════════════════════════════════════════════════ */

:root {
  --primary: #FF8400;
  --primary-hover: #ed8202;
  --primary-soft: #FFF3E0;
  --primary-tint: #FFF8F0;
  --success: #4CAF50;
  --danger: #c62828;
  --warning: #FF8400;
  --bg-main: #f8fafc;
  --bg-sidebar: #ffffff;
  --bg-card: #ffffff;
  --bg-light: #f5f5f5;
  --text-main: #334155;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-hover: 0 8px 24px rgba(255,132,0,0.15);
  --radius: 8px;
  --sidebar-width: 260px;
  --help-panel-width: 320px;
  --header-height: 56px;
  --flow-guide-height: 44px;

  --highlight: #fef3c7;
  --highlight-border: #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  line-height: 1.5;
  height: 100vh;
  overflow: hidden;
}

.app { display: flex; flex-direction: column; height: 100vh; }

/* ── Header ── */
.header {
  height: var(--header-height);
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  flex-shrink: 0;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo { font-weight: 800; font-size: 20px; color: var(--primary); letter-spacing: -0.5px; }
.project-name { font-size: 14px; color: var(--text-muted); font-weight: 600; }
.header-right { display: flex; align-items: center; gap: 12px; }
.version-select {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  background: white;
  cursor: pointer;
}
.settings-icon {
  width: 32px; height: 32px;
  background: var(--primary-soft);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--primary);
  transition: background 0.2s ease, transform 0.2s ease;
}
.settings-icon:hover { background: #ffe4c4; transform: rotate(15deg); }

/* ── Body (sidebar + main + help) ── */
.body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 12px 0;
}
.scenario-group { margin-bottom: 4px; }
.scenario-title {
  padding: 10px 20px 6px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}
.screen-item {
  padding: 8px 20px 8px 36px;
  font-size: 13px;
  color: var(--text-main);
  cursor: pointer;
  transition: all 0.15s;
  border-left: 3px solid transparent;
}
.screen-item:hover { background: #f1f5f9; }
.screen-item.active {
  background: var(--primary-tint);
  color: var(--primary);
  font-weight: 600;
  border-left-color: var(--primary);
}
.screen-item.highlight {
  background: var(--highlight);
  border-left-color: var(--highlight-border);
}

/* ── Main (viewport + flow-guide) ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.viewport {
  flex: 1;
  overflow-y: auto;
  background: var(--bg-main);
  padding: 24px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.viewport.mobile-mode { background: #1a1a2e; }

/* desktop frame */
.content-area {
  width: 100%;
  max-width: 1100px;
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 28px;
  border: 1px solid var(--border);
  min-height: 100%;
  transition: box-shadow 0.2s ease;
}
.content-area:hover { box-shadow: var(--shadow-hover); }

/* mobile frame (from aos mock) */
.phone-frame {
  width: 375px;
  height: 720px;
  background: #fff;
  border-radius: 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  overflow: hidden;
  position: relative;
  border: 8px solid #333;
  display: flex;
  flex-direction: column;
}
.phone-notch {
  width: 150px; height: 28px;
  background: #333;
  border-radius: 0 0 16px 16px;
  margin: 0 auto;
  flex-shrink: 0;
}
.phone-body { flex: 1; overflow-y: auto; }
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 20px;
  font-size: 12px;
  color: #333;
  font-weight: 600;
  flex-shrink: 0;
}
.status-bar .time { font-size: 14px; font-weight: 700; }

/* flow guide */
.flow-guide {
  display: none;
}
.flow-step {
  padding: 4px 10px;
  border-radius: 4px;
  background: rgba(255,255,255,0.08);
  white-space: nowrap;
}
.flow-step.current {
  background: var(--primary);
  color: white;
  font-weight: 600;
}
.flow-sep { color: #475569; }

/* code ref (aos mock) */
.code-ref {
  padding: 8px 12px;
  background: #f9f9f9;
  border-top: 1px solid #eee;
  font-size: 10px;
  color: #aaa;
  font-family: 'SF Mono', Menlo, monospace;
  line-height: 1.5;
}
.code-ref strong { color: #888; }

/* ── Help Panel ── */
.help-panel {
  width: var(--help-panel-width);
  background: white;
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px;
  flex-shrink: 0;
}
.help-title {
  font-size: 18px;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 8px;
}
.help-meta {
  display: inline-block;
  padding: 2px 8px;
  font-size: 10px;
  font-weight: 600;
  background: var(--primary-soft);
  color: var(--primary);
  border-radius: 4px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.help-subtitle {
  font-size: 12px;
  color: var(--primary);
  font-weight: 700;
  margin-top: 20px;
  margin-bottom: 8px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}
.help-item {
  font-size: 12px;
  color: #475569;
  margin-bottom: 4px;
  padding-left: 12px;
  position: relative;
}
.help-item::before {
  content: "-";
  position: absolute;
  left: 0;
}
.help-action {
  margin-top: 12px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.help-action:hover {
  border-color: var(--primary);
  background: var(--primary-tint);
}
.help-action.hover {
  border-color: var(--highlight-border);
  background: var(--highlight);
}
.help-action-title {
  font-size: 12px;
  color: var(--primary);
  font-weight: 700;
  margin-bottom: 4px;
}
.help-action-desc {
  font-size: 11px;
  color: #475569;
  line-height: 1.4;
}
.help-action-target {
  display: inline-block;
  margin-top: 6px;
  font-size: 10px;
  color: var(--primary);
  font-weight: 600;
}
.help-action-target::before { content: "→ "; }

/* ── Generic UI primitives (usable inside screen html) ── */
.btn {
  padding: 8px 24px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  border: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background 0.2s ease, color 0.2s ease,
              box-shadow 0.2s ease, transform 0.12s ease;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover {
  background: var(--primary-hover);
  box-shadow: 0 4px 14px rgba(255,132,0,0.35);
}
.btn-danger {
  background: #fff; color: var(--danger);
  border: 2px solid var(--danger);
}
.btn-danger:hover { background: #fce4ec; }
.btn-outline {
  background: #fff;
  border: 2px solid var(--primary);
  color: var(--primary);
}
.btn-outline:hover { background: var(--primary-soft); }

.page-title {
  font-size: 13px;
  color: var(--primary);
  font-weight: 700;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
}
.section-title {
  font-size: 22px; font-weight: 800; color: #1e293b;
  position: relative; padding-bottom: 6px;
}
.section-title::after {
  content: '';
  position: absolute;
  left: 0; bottom: 0;
  width: 36px; height: 3px;
  background: var(--primary);
  border-radius: 2px;
  transition: width 0.3s ease;
}
.content-area:hover .section-title::after { width: 72px; }

.form-group { margin-bottom: 18px; display: flex; align-items: center; }
.form-label {
  width: 180px;
  font-weight: 700;
  font-size: 14px;
  color: #334155;
}
.form-control {
  flex: 1;
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
}
.form-control:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(255, 132, 0, 0.18);
}

.data-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
.data-table th {
  background: var(--primary-soft);
  color: var(--primary-hover);
  padding: 12px;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  border-bottom: 2px solid var(--primary);
  border-top: 1px solid var(--border);
}
.data-table td {
  padding: 12px;
  border: 1px solid var(--border);
  text-align: center;
  font-size: 13px;
}
.data-table tr { cursor: pointer; transition: background 0.15s ease; }
.data-table tr:hover { background: var(--primary-tint); }
.data-table a { color: var(--primary); }

/* protocol badges */
.proto-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
}
.proto-badge.didvp   { background: #e8f5e9; color: #2e7d32; }
.proto-badge.oid4vp  { background: #e3f2fd; color: #1565c0; }
.proto-badge.sd-jwt  { background: #f3e5f5; color: #6a1b9a; }

.hidden { display: none !important; }

/* ── State Tabs ── */
.viewport-inner { width: 100%; max-width: 1100px; }
.state-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
  padding: 4px;
  background: var(--bg-light);
  border-radius: 8px;
  width: fit-content;
}
.state-tab {
  padding: 6px 16px;
  border: none;
  background: transparent;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.state-tab:hover { color: var(--text-main); background: white; }
.state-tab.active {
  background: var(--primary);
  color: white;
  box-shadow: 0 2px 8px rgba(255,132,0,0.25);
}

/* ── Status Badges ── */
.status-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
}
.status-badge.active { background: #e8f5e9; color: #2e7d32; }
.status-badge.inactive { background: #fafafa; color: #9e9e9e; }
.required { color: var(--danger); margin-left: 2px; }
.input-error { border-color: var(--danger) !important; box-shadow: 0 0 0 2px rgba(198,40,40,0.15) !important; }
.field-error { font-size: 11px; color: var(--danger); margin-top: 4px; margin-left: 4px; }

/* ── Empty / Error / Loading States ── */
.empty-state, .error-state, .verify-waiting {
  text-align: center;
  padding: 48px 24px;
}
.empty-icon, .error-icon { font-size: 40px; margin-bottom: 12px; }
.empty-title, .error-title { font-size: 16px; font-weight: 700; color: #1e293b; }
.empty-desc, .error-desc { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
.error-title { color: var(--danger); }
.skeleton-row {
  height: 44px;
  background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
  background-size: 200% 100%;
  animation: skeleton 1.5s ease-in-out infinite;
  border-radius: 6px;
  margin-bottom: 8px;
}
@keyframes skeleton {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ── QR Placeholder ── */
.qr-placeholder {
  width: 200px; height: 200px;
  border: 3px dashed var(--primary);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: var(--primary);
  background: var(--primary-soft);
}
.qr-placeholder.expired {
  border-color: var(--danger);
  color: var(--danger);
  background: #fce4ec;
}

/* ── Info Cards (결과 화면) ── */
.info-card {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 8px;
}
.info-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
.info-value { font-size: 14px; color: #1e293b; margin-top: 2px; }
.result-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 700;
}
.result-badge.success { background: #e8f5e9; color: #2e7d32; }
.result-badge.failed { background: #fce4ec; color: var(--danger); }
.result-section { margin-top: 16px; }

/* ── API Spec (help panel) ── */
.api-block {
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  margin-top: 8px;
  font-size: 11px;
}
.api-endpoint {
  font-family: 'SF Mono', Menlo, monospace;
  font-size: 12px;
  font-weight: 700;
  color: #1e293b;
  margin-bottom: 8px;
}
.api-method {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  color: white;
  background: var(--primary);
  margin-right: 4px;
}
.api-note {
  font-size: 11px;
  color: var(--text-muted);
  font-style: italic;
  margin-bottom: 8px;
  padding: 6px 8px;
  background: #fef3c7;
  border-radius: 4px;
}
.api-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
  margin-top: 10px;
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.api-sub-title {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  margin-top: 6px;
  margin-bottom: 4px;
}
.param-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.param-table th {
  background: var(--primary-tint);
  padding: 4px 6px;
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}
.param-table td {
  padding: 4px 6px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: top;
}
.param-table code { font-size: 11px; color: var(--primary-hover); }
.param-default {
  display: inline-block;
  padding: 0 4px;
  background: #e2e8f0;
  border-radius: 3px;
  font-size: 10px;
  color: #475569;
  margin-left: 4px;
}
.api-json {
  background: #1e293b;
  color: #e2e8f0;
  padding: 10px;
  border-radius: 6px;
  font-size: 11px;
  font-family: 'SF Mono', Menlo, monospace;
  overflow-x: auto;
  margin-top: 4px;
  white-space: pre-wrap;
}
.api-error {
  padding: 4px 0;
  font-size: 11px;
  color: #475569;
}
.api-error code {
  font-size: 10px;
  color: var(--danger);
  background: #fce4ec;
  padding: 1px 5px;
  border-radius: 3px;
  margin-right: 4px;
}

/* ── Sequence Diagram ── */
.sequence-diagram {
  margin-top: 8px;
  border-left: 3px solid var(--primary);
  padding-left: 12px;
}
.seq-step {
  padding: 6px 0;
  font-size: 11px;
  position: relative;
}
.seq-step::before {
  content: '';
  position: absolute;
  left: -18px;
  top: 12px;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: var(--primary);
}
.seq-step.seq-response::before { background: var(--success); }
.seq-step.seq-event::before { background: #7c3aed; }
.seq-step.seq-action::before { background: var(--text-muted); }
.seq-actor {
  display: inline-block;
  padding: 1px 6px;
  background: #e2e8f0;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 600;
  color: #334155;
}
.seq-arrow {
  display: inline-block;
  margin: 0 4px;
  font-size: 10px;
  color: var(--primary);
  font-weight: 700;
}
.seq-label {
  display: block;
  margin-top: 2px;
  font-size: 11px;
  color: #475569;
  padding-left: 2px;
}

/* ── Screen Map ── */
.screen-map-container {
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  margin-top: 16px;
  overflow: auto;
}
.screen-map-svg { width: 100%; height: auto; }
.map-node {
  fill: white;
  stroke: var(--primary);
  stroke-width: 2;
  transition: fill 0.15s;
}
.map-node:hover { fill: var(--primary-soft); }
.map-node-label {
  font-size: 13px;
  font-weight: 600;
  fill: #1e293b;
  text-anchor: middle;
  pointer-events: none;
}
.map-edge-label {
  font-size: 11px;
  font-weight: 600;
  fill: var(--primary-hover);
  text-anchor: middle;
  pointer-events: none;
  /* White halo so labels stay readable over lines/other labels */
  stroke: #ffffff;
  stroke-width: 4px;
  stroke-linejoin: round;
  paint-order: stroke fill;
}

/* ── Animations ── */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes sweep { 0%,100% { transform: translateX(-100%); } 50% { transform: translateX(100%); } }
@keyframes slideUp {
  from { transform: translateY(12px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,132,0,0.25);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
  vertical-align: middle;
}
.btn .spinner { margin-right: 6px; }

.content-area > * { animation: slideUp 0.3s ease-out; }

/* ── Print / PDF layout ── */
@media print {
  body, html { overflow: visible !important; height: auto !important; }
  .header, .sidebar, .help-panel, .flow-guide, .version-select { display: none !important; }
  .body { display: block; }
  .main, .viewport { overflow: visible !important; display: block; padding: 0; background: white; }
  .content-area, .phone-frame {
    page-break-after: always;
    box-shadow: none;
    border: 1px solid #ccc;
    margin: 20px auto;
  }
  .print-block { display: block !important; }
}
.print-block { display: none; }

  </style>
</head>
<body>
<div class="app">
  <!-- ══════ Header ══════ -->
  <header class="header">
    <div class="header-left">
      <div class="logo">OMN</div>
      <div class="project-name" id="projectName">Issuer Admin 화면 설계서</div>
    </div>
    <div class="header-right">
      <select class="version-select" id="versionSelect"></select>
      <div class="settings-icon" title="Settings">⚙</div>
    </div>
  </header>

  <!-- ══════ Body ══════ -->
  <div class="body">
    <!-- ── Sidebar (시나리오/화면 트리) ── -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- ── Main ── -->
    <main class="main">
      <div class="viewport" id="viewport">
        <!-- desktop 또는 mobile 프레임이 동적으로 삽입됨 -->
      </div>
      <div class="flow-guide" id="flowGuide"></div>
    </main>

    <!-- ── Help Panel ── -->
    <aside class="help-panel" id="helpPanel">
      <div style="font-size:13px;color:var(--text-muted)">화면을 선택하세요.</div>
    </aside>
  </div>
</div>

<script>window.__SPECS = [];</script>

<script>
/* ═══════════════════════════════════════════════════════════
   Unified Verifier — Spec Renderer v2
   Hash scheme: #<version>/<screenId>  e.g. #v1.0.0/policy-list
   No server required — works with file:// protocol
═══════════════════════════════════════════════════════════ */

const state = {
  specs: {},
  versions: [],
  version: null,
  spec: null,
  screenId: null,
  currentStateId: null,
};

const $ = (sel) => document.querySelector(sel);
const $id = (id) => document.getElementById(id);

/* ── Init ── */
function init() {
  const raw = window.__SPECS || [];
  if (!raw.length) {
    renderError('등록된 Spec이 없습니다. versions/vX.Y.Z/spec.js 를 확인하세요.');
    return;
  }
  raw.forEach(s => { state.specs[s.version] = s; });
  state.versions = Object.keys(state.specs).sort();

  const select = $id('versionSelect');
  select.innerHTML = '';
  state.versions.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    select.appendChild(opt);
  });
  select.addEventListener('change', () => navigateTo(select.value, null));
  window.addEventListener('hashchange', onHashChange);
  onHashChange();
}

function onHashChange() {
  const { version, screenId } = parseHash();
  const v = version && state.specs[version] ? version : state.versions[state.versions.length - 1];
  loadVersion(v);
  showScreen(screenId || defaultScreenId());
}

function parseHash() {
  const h = location.hash.replace(/^#/, '');
  if (!h) return {};
  const [version, screenId] = h.split('/');
  return { version, screenId };
}

function defaultScreenId() {
  return state.spec && state.spec.screens[0] ? state.spec.screens[0].id : null;
}

function loadVersion(version) {
  const spec = state.specs[version];
  if (!spec) return;
  state.spec = spec;
  state.version = version;
  $id('versionSelect').value = version;
  if (spec.project) $id('projectName').textContent = spec.project;
  renderSidebar();
}

/* ── Sidebar ── */
function renderSidebar() {
  const sidebar = $id('sidebar');
  sidebar.innerHTML = '';
  const { scenarios = [], screens = [] } = state.spec;

  const grouped = new Map();
  scenarios.forEach(s => grouped.set(s.id, { scenario: s, screens: [] }));
  grouped.set('__ungrouped', { scenario: { id: '__ungrouped', label: '기타' }, screens: [] });

  screens.forEach(scr => {
    const key = scr.scenarioId && grouped.has(scr.scenarioId) ? scr.scenarioId : '__ungrouped';
    grouped.get(key).screens.push(scr);
  });

  grouped.forEach((grp) => {
    if (!grp.screens.length) return;
    const g = document.createElement('div');
    g.className = 'scenario-group';
    const title = document.createElement('div');
    title.className = 'scenario-title';
    title.textContent = grp.scenario.label || grp.scenario.id;
    g.appendChild(title);
    grp.screens.forEach(scr => {
      const item = document.createElement('div');
      item.className = 'screen-item';
      item.dataset.screenId = scr.id;
      item.textContent = scr.title || scr.id;
      item.addEventListener('click', () => navigateTo(state.version, scr.id));
      g.appendChild(item);
    });
    sidebar.appendChild(g);
  });
}

/* ── Show Screen ── */
function showScreen(screenId) {
  if (!state.spec) return;
  const screen = state.spec.screens.find(s => s.id === screenId) || state.spec.screens[0];
  if (!screen) return;
  state.screenId = screen.id;
  state.currentStateId = null;

  document.querySelectorAll('.screen-item').forEach(el => {
    el.classList.toggle('active', el.dataset.screenId === screen.id);
    el.classList.remove('highlight');
  });

  renderViewport(screen);
  renderHelpPanel(screen);
  renderFlowGuide(screen);
  bindActionHighlight(screen);
}

/* ── Viewport (states 탭 + html) ── */
function renderViewport(screen) {
  const viewport = $id('viewport');
  viewport.innerHTML = '';
  viewport.classList.toggle('mobile-mode', screen.type === 'mobile');

  const hasStates = Array.isArray(screen.states) && screen.states.length > 0;
  const html = hasStates ? screen.states[0].html : (screen.html || '');
  if (hasStates) state.currentStateId = screen.states[0].id;

  if (screen.type === 'mobile') {
    viewport.appendChild(buildPhoneFrame(html, screen.codeRef));
  } else {
    const wrapper = document.createElement('div');
    wrapper.className = 'viewport-inner';

    // State tabs
    if (hasStates) {
      const tabs = document.createElement('div');
      tabs.className = 'state-tabs';
      screen.states.forEach((st, i) => {
        const tab = document.createElement('button');
        tab.className = 'state-tab' + (i === 0 ? ' active' : '');
        tab.textContent = st.label || st.id;
        tab.addEventListener('click', () => switchState(screen, st.id));
        tabs.appendChild(tab);
      });
      wrapper.appendChild(tabs);
    }

    const frame = document.createElement('div');
    frame.className = 'content-area';
    frame.id = 'contentFrame';
    frame.innerHTML = html;
    wrapper.appendChild(frame);
    viewport.appendChild(wrapper);
  }

  // Screen map auto-render
  if (screen.id === 'screen-map') {
    setTimeout(() => renderScreenMap(), 0);
  }
}

function switchState(screen, stateId) {
  const st = screen.states.find(s => s.id === stateId);
  if (!st) return;
  state.currentStateId = stateId;

  document.querySelectorAll('.state-tab').forEach(t => t.classList.remove('active'));
  const tabs = document.querySelectorAll('.state-tab');
  const idx = screen.states.findIndex(s => s.id === stateId);
  if (tabs[idx]) tabs[idx].classList.add('active');

  const frame = $id('contentFrame');
  if (frame) {
    frame.style.opacity = '0';
    frame.style.transform = 'translateY(8px)';
    setTimeout(() => {
      frame.innerHTML = st.html;
      frame.style.opacity = '1';
      frame.style.transform = 'translateY(0)';
    }, 120);
  }
}

function buildPhoneFrame(html, codeRef) {
  const frame = document.createElement('div');
  frame.className = 'phone-frame';
  frame.innerHTML = `
    <div class="phone-notch"></div>
    <div class="status-bar"><span class="time">9:41</span><span>● ● ● ●</span></div>
    <div class="phone-body">${html}</div>
    ${codeRef ? `<div class="code-ref"><strong>CODE:</strong> ${codeRef}</div>` : ''}
  `;
  return frame;
}

/* ── Help Panel (진입조건 + API + 시퀀스 + 액션) ── */
function renderHelpPanel(screen) {
  const panel = $id('helpPanel');
  const parts = [];
  parts.push(`<div class="help-meta">${screen.type || 'desktop'}</div>`);
  parts.push(`<div class="help-title">${esc(screen.title || screen.id)}</div>`);

  if (arr(screen.changes)) {
    parts.push(`<div class="help-subtitle">이번 변경점</div>`);
    screen.changes.forEach(t => parts.push(`<div class="help-item">${esc(t)}</div>`));
  }

  // 진입 조건
  if (arr(screen.entry)) {
    parts.push(`<div class="help-subtitle">진입 조건</div>`);
    screen.entry.forEach(t => parts.push(`<div class="help-item">${esc(t)}</div>`));
  }
  // 초기 화면
  if (arr(screen.initial)) {
    parts.push(`<div class="help-subtitle">초기 화면</div>`);
    screen.initial.forEach(t => parts.push(`<div class="help-item">${esc(t)}</div>`));
  }

  // API 스펙
  if (screen.api) {
    parts.push(renderApiSpec(screen.api));
  }

  // 시퀀스 다이어그램
  if (arr(screen.sequence)) {
    parts.push(renderSequence(screen.sequence));
  }

  // 버튼 · 액션
  if (arr(screen.actions)) {
    parts.push(`<div class="help-subtitle">버튼 · 액션</div>`);
    screen.actions.forEach(a => {
      parts.push(`
        <div class="help-action" data-target="${a.target || ''}">
          <div class="help-action-title">${esc(a.label || a.id || '')}</div>
          <div class="help-action-desc">${esc(a.description || '')}</div>
          ${a.target ? `<div class="help-action-target">${esc(a.target)}</div>` : ''}
        </div>
      `);
    });
  }
  panel.innerHTML = parts.join('');
}

/* ── API Spec Renderer ── */
function renderApiSpec(api) {
  const p = [];
  p.push(`<div class="help-subtitle">API</div>`);
  p.push(`<div class="api-block">`);
  p.push(`<div class="api-endpoint"><span class="api-method">${esc(api.method || 'GET')}</span> <code>${esc(api.endpoint)}</code></div>`);

  if (api.note) {
    p.push(`<div class="api-note">${esc(api.note)}</div>`);
  }

  // Request
  const req = api.request;
  if (req) {
    p.push(`<div class="api-section-title">Request</div>`);
    if (req.query) {
      p.push(`<div class="api-sub-title">Query Parameters</div>`);
      p.push(renderParamTable(req.query));
    }
    if (req.body) {
      p.push(`<div class="api-sub-title">Body</div>`);
      p.push(renderParamTable(req.body));
    }
  }

  // Response
  if (api.response && api.response.body) {
    p.push(`<div class="api-section-title">Response</div>`);
    p.push(`<pre class="api-json">${esc(JSON.stringify(api.response.body, null, 2))}</pre>`);
  }

  // Errors
  if (arr(api.errors)) {
    p.push(`<div class="api-section-title">Errors</div>`);
    api.errors.forEach(e => {
      p.push(`<div class="api-error"><code>${esc(e.code)}</code> ${esc(e.desc)}</div>`);
    });
  }
  p.push(`</div>`);
  return p.join('');
}

function renderParamTable(params) {
  const rows = Object.entries(params).map(([key, val]) => {
    if (typeof val === 'object' && val !== null && val.type) {
      const req = val.required ? '<span class="required">*</span>' : '';
      const def = val.default !== undefined ? `<span class="param-default">${val.default}</span>` : '';
      return `<tr><td><code>${esc(key)}</code>${req}</td><td>${esc(val.type)}</td><td>${esc(val.desc || '')} ${def}</td></tr>`;
    } else {
      const display = typeof val === 'object' ? JSON.stringify(val) : String(val);
      return `<tr><td><code>${esc(key)}</code></td><td colspan="2">${esc(display)}</td></tr>`;
    }
  });
  return `<table class="param-table"><thead><tr><th>필드</th><th>타입</th><th>설명</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
}

/* ── Sequence Diagram ── */
function renderSequence(steps) {
  const p = [];
  p.push(`<div class="help-subtitle">시퀀스</div>`);
  p.push(`<div class="sequence-diagram">`);
  steps.forEach(s => {
    const typeClass = s.type || 'request';
    const arrow = typeClass === 'response' ? '◄──' : (typeClass === 'event' ? '◄╌╌' : '──►');
    const isSelf = s.from === s.to;
    if (isSelf) {
      p.push(`<div class="seq-step seq-${typeClass}"><span class="seq-actor">${esc(s.from)}</span> <span class="seq-arrow">↻</span> <span class="seq-label">${esc(s.label)}</span></div>`);
    } else {
      p.push(`<div class="seq-step seq-${typeClass}"><span class="seq-actor">${esc(s.from)}</span> <span class="seq-arrow">${arrow}</span> <span class="seq-actor">${esc(s.to)}</span><div class="seq-label">${esc(s.label)}</div></div>`);
    }
  });
  p.push(`</div>`);
  return p.join('');
}

/* ── Screen Map (auto-generated from all actions) ── */
function renderScreenMap() {
  const container = $id('screen-map-auto');
  if (!container || !state.spec) return;

  const screens = state.spec.screens.filter(s => s.id !== 'screen-map');
  const nodes = new Map();
  const edges = [];

  screens.forEach(s => {
    nodes.set(s.id, { id: s.id, title: s.title || s.id, scenario: s.scenarioId || '' });
    if (arr(s.actions)) {
      s.actions.forEach(a => {
        if (a.target && a.target !== s.id) {
          edges.push({ from: s.id, to: a.target, label: a.label || a.id });
        }
      });
    }
  });

  // Simple grid layout
  const nodeArr = Array.from(nodes.values());
  const cols = Math.min(3, nodeArr.length);
  const cellW = 220, cellH = 120, padX = 40, padY = 40;
  const svgW = cols * cellW + padX * 2;
  const rows = Math.ceil(nodeArr.length / cols);
  const svgH = rows * cellH + padY * 2;

  const positions = new Map();
  nodeArr.forEach((n, i) => {
    const col = i % cols;
    const row = Math.floor(i / cols);
    positions.set(n.id, {
      x: padX + col * cellW + cellW / 2,
      y: padY + row * cellH + cellH / 2
    });
  });

  // Group edges by from→to pair so multiple labels stack cleanly
  const edgeMap = new Map();
  edges.forEach(e => {
    const key = `${e.from}→${e.to}`;
    if (!edgeMap.has(key)) edgeMap.set(key, { from: e.from, to: e.to, labels: [] });
    edgeMap.get(key).labels.push(e.label);
  });

  // Track how many edges connect each node pair (in either direction) for lateral offset
  const pairCount = new Map();
  const pairIndex = new Map();
  edgeMap.forEach(e => {
    const key = [e.from, e.to].sort().join('|');
    pairCount.set(key, (pairCount.get(key) || 0) + 1);
  });

  let svg = `<svg viewBox="0 0 ${svgW} ${svgH}" class="screen-map-svg">`;
  svg += `<defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="var(--primary)"/></marker></defs>`;

  const nodeW = 180, nodeH = 52;

  // Edges — line ends clipped to node border, arrow offset, labels grouped + outlined
  edgeMap.forEach(e => {
    const from = positions.get(e.from);
    const to = positions.get(e.to);
    if (!from || !to) return;

    // Clip endpoints to node rectangle borders so arrow meets the node edge, not its center
    const { x: x1, y: y1 } = clipToRect(from, to, nodeW, nodeH);
    const { x: x2, y: y2 } = clipToRect(to, from, nodeW, nodeH);

    // Lateral offset when two edges connect the same pair (bidirectional)
    const pairKey = [e.from, e.to].sort().join('|');
    const cnt = pairCount.get(pairKey) || 1;
    const idx = pairIndex.get(pairKey) || 0;
    pairIndex.set(pairKey, idx + 1);
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.max(1, Math.sqrt(dx*dx + dy*dy));
    const nx = -dy / len, ny = dx / len;           // unit normal
    const offset = cnt > 1 ? (idx - (cnt - 1) / 2) * 14 : 0;

    const sx = x1 + nx * offset, sy = y1 + ny * offset;
    const ex = x2 + nx * offset, ey = y2 + ny * offset;

    svg += `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="var(--primary)" stroke-width="2" marker-end="url(#arrowhead)" opacity="0.65"/>`;

    // Labels: stack vertically at midpoint, with white stroke outline for readability
    const mx = (sx + ex) / 2;
    const my = (sy + ey) / 2;
    const lineHeight = 13;
    const totalH = e.labels.length * lineHeight;
    const startY = my - totalH / 2 + lineHeight - 2;
    e.labels.forEach((label, i) => {
      svg += `<text x="${mx}" y="${startY + i * lineHeight}" class="map-edge-label">${esc(label)}</text>`;
    });
  });

  // Nodes (drawn last so they sit above edge lines)
  nodeArr.forEach(n => {
    const p = positions.get(n.id);
    const rx = 8;
    svg += `<rect x="${p.x - nodeW/2}" y="${p.y - nodeH/2}" width="${nodeW}" height="${nodeH}" rx="${rx}" class="map-node" data-screen-id="${n.id}"/>`;
    svg += `<text x="${p.x}" y="${p.y + 5}" class="map-node-label">${esc(n.title)}</text>`;
  });

  svg += `</svg>`;
  container.innerHTML = svg;

  // Click to navigate
  container.querySelectorAll('.map-node').forEach(el => {
    el.style.cursor = 'pointer';
    el.addEventListener('click', () => navigateTo(state.version, el.dataset.screenId));
  });
}

/* ── Flow Guide ── */
function renderFlowGuide(screen) {
  const guide = $id('flowGuide');
  guide.innerHTML = '';
  return;
  const scenarioId = screen.scenarioId;
  if (!scenarioId) { guide.innerHTML = ''; return; }
  const siblings = state.spec.screens.filter(s => s.scenarioId === scenarioId);
  if (siblings.length < 2) { guide.innerHTML = ''; return; }
  const parts = [];
  siblings.forEach((s, i) => {
    if (i > 0) parts.push(`<span class="flow-sep">›</span>`);
    const cls = s.id === screen.id ? 'flow-step current' : 'flow-step';
    parts.push(`<span class="${cls}" data-screen-id="${s.id}" role="button">${esc(s.title || s.id)}</span>`);
  });
  guide.innerHTML = parts.join('');
  guide.querySelectorAll('.flow-step').forEach(el => {
    el.addEventListener('click', () => navigateTo(state.version, el.dataset.screenId));
  });
}

/* ── Action Highlight ── */
function bindActionHighlight(screen) {
  document.querySelectorAll('.help-action').forEach(el => {
    const target = el.dataset.target;
    el.addEventListener('mouseenter', () => {
      el.classList.add('hover');
      if (target) {
        const si = document.querySelector(`.screen-item[data-screen-id="${target}"]`);
        if (si) si.classList.add('highlight');
      }
    });
    el.addEventListener('mouseleave', () => {
      el.classList.remove('hover');
      if (target) {
        const si = document.querySelector(`.screen-item[data-screen-id="${target}"]`);
        if (si) si.classList.remove('highlight');
      }
    });
    el.addEventListener('click', () => { if (target) navigateTo(state.version, target); });
  });
}

function navigateTo(version, screenId) {
  const v = version || state.version;
  const s = screenId || state.screenId || defaultScreenId();
  location.hash = s ? `${v}/${s}` : v;
}

function renderError(msg) {
  $id('viewport').innerHTML = `<div class="content-area" style="color:var(--danger)">${esc(msg)}</div>`;
}

/* ── Clip a line from `center` towards `target` to the node rectangle border ── */
function clipToRect(center, target, w, h) {
  const dx = target.x - center.x;
  const dy = target.y - center.y;
  if (dx === 0 && dy === 0) return { x: center.x, y: center.y };
  const hx = w / 2, hy = h / 2;
  // Parametric t ∈ (0,1] where line from center meets rectangle edge
  const tx = dx === 0 ? Infinity : hx / Math.abs(dx);
  const ty = dy === 0 ? Infinity : hy / Math.abs(dy);
  const t = Math.min(tx, ty);
  return { x: center.x + dx * t, y: center.y + dy * t };
}

/* ── Helpers ── */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function arr(v) { return Array.isArray(v) && v.length > 0; }

init();

</script>
</body>
